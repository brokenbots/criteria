# Peer-mode remote adapter demo: two adapter peers phone home to a criteria
# host running a workflow with per-scope sessions. See README.md for the
# bring-up steps and the kill -9 crash-diagnosis demo.
#
# Digest pinning: the demo lockfile (.criteria.lock.hcl) pins the real OCI
# digests for the shell and noop adapters, and each peer presents its pinned
# digest on dial — the host's digest gate is fail-closed. The peer
# entrypoints read the digest straight from the mounted lockfile; set
# PEER_DIGEST to override (e.g. when the operator injects a digest from the
# provision_wanted lifecycle event, see docs/adapter-remote-deployment.md).
services:
  criteria-host:
    image: ghcr.io/brokenbots/criteria:latest
    command: ["apply", "/workspace/workflow.hcl"]
    ports:
      - "7778:7778"
    volumes:
      - ./workflow.hcl:/workspace/workflow.hcl:ro
      - ./.criteria.lock.hcl:/workspace/.criteria.lock.hcl:ro
      - criteria-home:/data/criteria
    environment:
      # The rotated per-scope accept tokens are written under
      # $CRITERIA_HOME/runs/<run_id>/remote-tokens/... ; the shared volume
      # lets the peer entrypoints act as the provisioning operator.
      - CRITERIA_HOME=/data/criteria
      - CRITERIA_LOG_LEVEL=info

  shell-peer:
    <<: *peer-operator
    build:
      context: ../..
      dockerfile: images/remote-adapters/Dockerfile.peer
      args:
        ADAPTER_NAME: shell
        ADAPTER_VERSION: "0.5.3"
        CRITERIA_VERSION: latest
    depends_on:
      - criteria-host
    volumes:
      # Read access to the rotated token files: the entrypoint acts as the
      # operator, reconciling the host's provision_wanted provisioning.
      - criteria-home:/data/criteria:ro
      # The pinned digest the peer must present on dial (see entrypoint).
      - ./.criteria.lock.hcl:/workspace/.criteria.lock.hcl:ro
    environment:
      - CRITERIA_REMOTE_HOST=criteria-host:7778
      - CRITERIA_ADAPTER_NAME=shell
      - CRITERIA_LOG_LEVEL=info

  noop-peer:
    <<: *peer-operator
    build:
      context: ../..
      dockerfile: images/remote-adapters/Dockerfile.peer
      args:
        ADAPTER_NAME: noop
        ADAPTER_VERSION: "0.5.2"
        CRITERIA_VERSION: latest
    depends_on:
      - criteria-host
    volumes:
      - criteria-home:/data/criteria:ro
      - ./.criteria.lock.hcl:/workspace/.criteria.lock.hcl:ro
    environment:
      - CRITERIA_REMOTE_HOST=criteria-host:7778
      - CRITERIA_ADAPTER_NAME=noop
      - CRITERIA_LOG_LEVEL=info

# Both peers wait for the host to rotate their per-scope accept tokens and
# then dial in with the registered scope key. This entrypoint override is the
# compose stand-in for the operator pattern: reconcile on provision_wanted by
# injecting CRITERIA_REMOTE_HOST/TOKEN/SCOPE/DIGEST into the peer. The peer
# retries its connection with full-jitter backoff, so no health gate is
# needed for startup ordering.
x-peer-operator: &peer-operator
  entrypoint: ["sh", "-c"]
  command:
    - |
      set -eu
      adapter="$${CRITERIA_ADAPTER_NAME:-shell}"
      echo "peer operator: waiting for rotated token for adapter $${adapter}"
      token_file=""
      i=0
      while [ $$i -lt 120 ]; do
        # Pick the NEWEST token file for this adapter type: after a crash
        # + respawn the released prior scope's token file still exists, and
        # the restarted peer must dial with the freshly rotated token.
        token_file=""
        newest=0
        for f in $$(find /data/criteria/runs -type f -name "$$adapter.token" 2>/dev/null); do
          m=$$(stat -c %Y "$$f" 2>/dev/null || echo 0)
          if [ "$$m" -gt "$$newest" ]; then
            newest=$$m
            token_file="$$f"
          fi
        done
        [ -n "$$token_file" ] && break
        i=$$((i + 1))
        sleep 2
      done
      [ -n "$$token_file" ] || { echo "no token file for adapter $${adapter}"; exit 1; }
      instance_dir=$$(dirname "$$token_file")
      scopes_dir=$$(dirname "$$instance_dir")
      scope_name=$$(basename "$$scopes_dir")
      instance_id=$$(basename "$$instance_dir")
      # The host derives scope keys as scopeName + "/" + scopeInstanceID; a
      # root-scope run has an empty scope name, and its token files collapse
      # to remote-tokens/<instance_id>/<type>.token, so the key is "/<id>".
      scope_key="/$$instance_id"
      if [ "$$scope_name" != "remote-tokens" ]; then
        scope_key="$$scope_name/$$instance_id"
      fi
      export CRITERIA_REMOTE_TOKEN=$$(cat "$$token_file")
      export CRITERIA_REMOTE_SCOPE="$$scope_key"
      # Present the digest pinned in the demo lockfile for this adapter
      # type: the host's digest gate is fail-closed and rejects any dial
      # whose digest does not match the pin. PEER_DIGEST overrides.
      if [ -z "$${PEER_DIGEST:-}" ] && [ -f /workspace/.criteria.lock.hcl ]; then
        pinned=$$(grep -A3 "adapter \"$$adapter\" \"" /workspace/.criteria.lock.hcl \
          | sed -n 's/.*resolved_digest *= *"\([^"]*\)".*/\1/p' | head -n1)
        if [ -n "$$pinned" ]; then
          PEER_DIGEST=$$pinned
        fi
      fi
      export CRITERIA_REMOTE_DIGEST=$${PEER_DIGEST:-}
      echo "peer operator: dialing with scope $${scope_key} digest $${CRITERIA_REMOTE_DIGEST:-none}"
      exec criteria peer

volumes:
  criteria-home: