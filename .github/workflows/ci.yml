name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-lint-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Enforce import boundaries
        run: make lint-imports

      - name: Lint Go (golangci-lint)
        run: make lint-go

      - name: Lint baseline cap check
        run: make lint-baseline-check

      - name: spec-check
        run: make spec-check

      - name: no-todo-markers-in-production-code
        run: make lint-no-todos

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-unit-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-unit-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Run tests (root + sdk + workflow)
        run: |
          go test -race -count=2 ./...
          (cd sdk      && go test -race -count=2 ./...)
          (cd workflow && go test -race -count=2 ./...)

      - name: Run conformance tests
        run: make test-conformance

  e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    env:
      # The shell adapter is now an out-of-process discovered binary (not an
      # in-process builtin), so e2e steps must find the built adapter plugins.
      CRITERIA_ADAPTERS: ${{ github.workspace }}/bin
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Build binary and adapter plugins
        run: make build plugins

      - name: CLI smoke test
        run: ./bin/criteria apply examples/hello --events-file /tmp/events.ndjson

      - name: Validate example workflows
        run: make validate

      - name: Run example plugin end-to-end
        run: make example-plugin

  install-script-syntax:
    name: Install script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: install-script-syntax
        run: make lint-sh

  homebrew-tap-script:
    name: Homebrew tap update script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Syntax check update script
        run: python3 -m py_compile .github/scripts/update-homebrew-tap.py

      - name: Test update script against v0.5.7
        run: |
          set -euo pipefail
          tmp_tap="$(mktemp -d)"
          python3 .github/scripts/update-homebrew-tap.py v0.5.7 "$tmp_tap"

          expected_darwin_arm64="bf091e09473dbc8d087406744e92284c7a2a31f8a9a2f54b4810942cd3dca208"
          expected_linux_amd64="cee7e824612f098b59d342cf0549656810282d6f80bb583b5d1ac743d5d718fb"
          expected_linux_arm64="3471e14311a7396217f40b572533d64d2d5f1ad2fc1dd939ff6a07c2e93e7601"

          grep -q "sha256 \"$expected_darwin_arm64\"" "$tmp_tap/Formula/criteria.rb"
          grep -q "sha256 \"$expected_linux_amd64\"" "$tmp_tap/Formula/criteria.rb"
          grep -q "sha256 \"$expected_linux_arm64\"" "$tmp_tap/Formula/criteria.rb"

          ruby -c "$tmp_tap/Formula/criteria.rb"

  proto-drift:
    name: Proto drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint proto files
        run: buf lint
        continue-on-error: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Check proto drift
        run: make proto-check-drift

  osv-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    # WS51 cleared the dependency backlog and flipped this gate to blocking: it is
    # now a required check in all-checks. A PR introducing a dependency with a
    # known OSV advisory fails CI until upgraded or time-boxed in osv-scanner.toml.
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-osv-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-osv-${{ runner.os }}-

      # Pinned version (no @latest) for reproducibility and local parity with
      # `make vuln-scan`. Covers every Go module in the workspace via -r. (GitHub
      # Actions advisories are covered by the Dependabot github-actions ecosystem,
      # WS50: osv-scanner v2.3.8 does not bundle a workflow extractor.)
      - name: Run osv-scanner
        run: make vuln-scan

  deps-report:
    name: Dependency freshness report
    runs-on: ubuntu-latest
    # WS50: non-blocking by design. Enforcement of "latest major.minor" lives
    # with review + the catch-up workstream (WS51); a hard gate would flap on
    # upstream release cadence. This job only surfaces drift on every PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-deps-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-deps-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Outdated direct dependencies (latest minor/patch)
        run: |
          {
            echo '## Dependency freshness report'
            echo
            echo '### Outdated direct deps (`make deps-outdated`)'
            echo '```'
            make deps-outdated 2>&1 || true
            echo '```'
            echo '### Available major upgrades (`make deps-majors`)'
            echo '```'
            make deps-majors 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-artifacts:
    name: Release artifacts (RC PRs only)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && (
        startsWith(github.head_ref, 'release/') ||
        contains(github.event.pull_request.title, '-rc')
      )
    needs: [unit-tests, e2e]
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync workspace
        run: go work sync

      - name: Extract RC tag from branch or title
        id: rc
        run: |
          # 1. Prefer the branch name (release/<tag>).
          tag=""
          if [[ "${GITHUB_HEAD_REF}" == release/* ]]; then
            tag="${GITHUB_HEAD_REF#release/}"
          fi
          # 2. Title: match a full semver+rc token (e.g. v0.3.0-rc1). The -rcN suffix is required.
          if [[ -z "$tag" ]]; then
            tag="$(echo "${PR_TITLE}" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+' | head -1 || true)"
          fi
          # 3. Title fallback: extract just the rcN marker from any -rcN substring.
          if [[ -z "$tag" ]]; then
            tag="$(echo "${PR_TITLE}" | grep -oE -- '-rc[0-9]+' | head -1 | sed 's/^-//' || true)"
          fi
          if [[ -z "$tag" ]]; then
            echo "ERROR: could not extract RC tag from branch or title"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Build CLI binary
        run: make build

      - name: Build adapter plugins
        run: make plugins

      - name: Build runtime container image
        run: make docker-runtime

      - name: Save runtime image as tar
        run: |
          docker save criteria/runtime:dev -o bin/criteria-runtime.tar

      - name: Generate SHA256SUMS
        working-directory: bin
        run: sha256sum criteria criteria-adapter-* criteria-runtime.tar > SHA256SUMS

      - name: Bundle artifacts
        run: |
          mkdir -p artifact
          cp bin/criteria bin/criteria-adapter-* bin/criteria-runtime.tar bin/SHA256SUMS artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: criteria-${{ steps.rc.outputs.tag }}
          path: artifact/
          retention-days: 30
          if-no-files-found: error

  coverage-check:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    # WS44: per-package non-regression gate. Runs after unit-tests so a test
    # failure surfaces before a coverage failure. Floors live in
    # tools/coverage-floors.txt; a PR that drops below floor must add tests or
    # lower the floor with a documented reason.
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-cover-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-cover-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Enforce coverage floor
        run: make coverage-check

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e, install-script-syntax, proto-drift, osv-scan, coverage-check]
    steps:
      - run: echo "All required checks passed."
