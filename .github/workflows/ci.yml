name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-lint-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Enforce import boundaries
        run: make lint-imports

      - name: Lint Go (golangci-lint)
        run: make lint-go

      - name: Lint baseline cap check
        run: make lint-baseline-check

      - name: spec-check
        run: make spec-check

      - name: no-todo-markers-in-production-code
        run: make lint-no-todos

  # Docs-only classification backs the repo-state job gates below: every
  # changed PR file matching docs/** or **/*.md is documentation and cannot
  # change dependencies, build output, or release artifacts, so scanning the
  # dependency state of the merge ref would only re-report pre-existing main
  # health. The classifier fails closed (docs_only=false) on anything it
  # cannot observe, including empty diffs and git errors.
  changes:
    name: Detect docs-only PR
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # Full history is only needed to compute the merge-base diff of a
      # pull_request; other events skip checkout and default to full CI.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          .github/scripts/detect-docs-only.sh >> "$GITHUB_OUTPUT"

  # Positive green signal for docs-only PRs (which skip the repo-state jobs).
  docs-only-skip:
    name: Docs-only PR (repo-state scans skipped)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - name: Confirm skip
        run: |
          echo "Documentation-only PR: repo-state scans skipped (a docs diff cannot cause or fix a vulnerability)."

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [changes]
    # Docs-only PRs skip this repo-state job; mixed diffs run it (see changes).
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-unit-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-unit-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Run unit tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            echo "Detecting affected packages against $base..."
            pkgs=$(go run ./tools/affected-test-packages --base "$base")
            if [ -z "$pkgs" ]; then
              echo "No Go packages affected by changes in this pull request. Skipping unit tests."
            else
              echo "Running tests for affected packages:"
              echo "$pkgs"
              go test -race $pkgs
            fi
            if [ -n "$pkgs" ] && [ "$(go run ./tools/affected-test-packages --base "$base" --conformance)" = "true" ]; then
              echo "Conformance-critical packages affected; running conformance suite."
              make test-conformance
            else
              echo "SDK conformance not affected; skipping conformance suite."
            fi
          else
            echo "Running full unit test suite (trunk/push)..."
            make test
            make test-conformance
          fi

  e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    needs: [changes]
    # Docs-only PRs skip this repo-state job; mixed diffs run it (see changes).
    if: needs.changes.outputs.docs_only != 'true'
    env:
      # The shell adapter is now an out-of-process discovered binary (not an
      # in-process builtin), so e2e steps must find the built adapter plugins.
      CRITERIA_ADAPTERS: ${{ github.workspace }}/bin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Build binary and adapter plugins
        run: make build plugins

      - name: CLI smoke test
        run: ./bin/criteria apply examples/hello --events-file /tmp/events.ndjson

      - name: Validate example workflows
        run: make validate

      - name: Run example adapter end-to-end
        run: make example-adapter

      - name: Run adapter tools example end-to-end
        run: make example-adapter-tools

  install-script-syntax:
    name: Install script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install-script-syntax
        run: make lint-sh

  homebrew-tap-script:
    name: Homebrew tap update script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Syntax check update script
        run: python3 -m py_compile .github/scripts/update-homebrew-tap.py

      - name: Test update script against v0.5.7
        run: |
          set -euo pipefail
          tmp_tap="$(mktemp -d)"
          python3 .github/scripts/update-homebrew-tap.py v0.5.7 "$tmp_tap"

          expected_darwin_arm64="bf091e09473dbc8d087406744e92284c7a2a31f8a9a2f54b4810942cd3dca208"
          expected_linux_amd64="cee7e824612f098b59d342cf0549656810282d6f80bb583b5d1ac743d5d718fb"
          expected_linux_arm64="3471e14311a7396217f40b572533d64d2d5f1ad2fc1dd939ff6a07c2e93e7601"

          grep -q "sha256 \"$expected_darwin_arm64\"" "$tmp_tap/Formula/criteria.rb"
          grep -q "sha256 \"$expected_linux_amd64\"" "$tmp_tap/Formula/criteria.rb"
          grep -q "sha256 \"$expected_linux_arm64\"" "$tmp_tap/Formula/criteria.rb"

          ruby -c "$tmp_tap/Formula/criteria.rb"

  proto-drift:
    name: Proto drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint proto files
        run: buf lint
        continue-on-error: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Check proto drift
        run: make proto-check-drift

  workspace-sync-drift:
    name: Workspace sync drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go work sync must be a no-op on a clean tree
        run: |
          set -euo pipefail
          go work sync
          if ! git diff --quiet -- '*.mod' '*.sum'; then
            echo "::error::go work sync modified tracked module files — commit the sync result:"
            git --no-pager diff --stat -- '*.mod' '*.sum'
            exit 1
          fi
          echo "go work sync is a no-op; workspace modules are consistent."

  osv-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    needs: [changes]
    # A docs diff cannot introduce an advisory; skipping avoids failing docs
    # PRs on pre-existing main health. Mixed diffs run it (see changes).
    if: needs.changes.outputs.docs_only != 'true'
    # WS51 cleared the dependency backlog and flipped this gate to blocking: it is
    # now a required check in all-checks. A PR introducing a dependency with a
    # known OSV advisory fails CI until upgraded or time-boxed in osv-scanner.toml.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-osv-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-osv-${{ runner.os }}-

      # Pinned version (no @latest) for reproducibility and local parity with
      # `make vuln-scan`. Covers every Go module in the workspace via -r. (GitHub
      # Actions advisories are covered by the Dependabot github-actions ecosystem,
      # WS50: osv-scanner v2.3.8 does not bundle a workflow extractor.)
      - name: Run osv-scanner
        run: make vuln-scan

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    needs: [changes]
    # A docs diff cannot import a vulnerable symbol; skipping avoids failing
    # docs PRs on pre-existing main health. Mixed diffs run it (see changes).
    if: needs.changes.outputs.docs_only != 'true'
    # Blocking govulncheck gate. Detects known Go vulnerabilities in
    # reachable code paths across all workspace modules. Failures must be
    # resolved by upgrading the affected dependency or documenting a reachable
    # false positive with a suppression.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-govulncheck-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-govulncheck-${{ runner.os }}-

      # Pinned version (no @latest) for reproducibility and local parity with
      # `make vulncheck`. Scans each workspace module separately so findings are
      # attributed to the module that imports the vulnerable dependency.
      - name: Run govulncheck
        run: make vulncheck

  deps-report:
    name: Dependency freshness report
    runs-on: ubuntu-latest
    needs: [changes]
    # A docs diff cannot change the dependency tree; skipping avoids flapping
    # docs PRs on pre-existing main drift. Mixed diffs run it (see changes).
    if: needs.changes.outputs.docs_only != 'true'
    # WS50: non-blocking by design. Enforcement of "latest major.minor" lives
    # with review + the catch-up workstream (WS51); a hard gate would flap on
    # upstream release cadence. This job only surfaces drift on every PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-deps-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-deps-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Outdated direct dependencies (latest minor/patch)
        run: |
          {
            echo '## Dependency freshness report'
            echo
            echo '### Outdated direct deps (`make deps-outdated`)'
            echo '```'
            make deps-outdated 2>&1 || true
            echo '```'
            echo '### Available major upgrades (`make deps-majors`)'
            echo '```'
            make deps-majors 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-artifacts:
    name: Release artifacts (RC PRs only)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && (
        startsWith(github.head_ref, 'release/') ||
        contains(github.event.pull_request.title, '-rc')
      )
    needs: [unit-tests, e2e, changes]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync workspace
        run: go work sync

      - name: Extract RC tag from branch or title
        id: rc
        run: |
          # 1. Prefer the branch name (release/<tag>).
          tag=""
          if [[ "${GITHUB_HEAD_REF}" == release/* ]]; then
            tag="${GITHUB_HEAD_REF#release/}"
          fi
          # 2. Title: match a full semver+rc token (e.g. v0.3.0-rc1). The -rcN suffix is required.
          if [[ -z "$tag" ]]; then
            tag="$(echo "${PR_TITLE}" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+' | head -1 || true)"
          fi
          # 3. Title fallback: extract just the rcN marker from any -rcN substring.
          if [[ -z "$tag" ]]; then
            tag="$(echo "${PR_TITLE}" | grep -oE -- '-rc[0-9]+' | head -1 | sed 's/^-//' || true)"
          fi
          if [[ -z "$tag" ]]; then
            echo "ERROR: could not extract RC tag from branch or title"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Build CLI binary
        run: make build

      - name: Build adapter plugins
        run: make plugins

      - name: Build runtime container image
        run: make docker-runtime

      - name: Smoke bundled adapters in-container (network none)
        run: make docker-runtime-smoke

      - name: Save runtime image as tar
        run: |
          docker save criteria/runtime:dev -o bin/criteria-runtime.tar

      - name: Generate SHA256SUMS
        working-directory: bin
        run: sha256sum criteria criteria-adapter-* criteria-runtime.tar > SHA256SUMS

      - name: Bundle artifacts
        run: |
          mkdir -p artifact
          cp bin/criteria bin/criteria-adapter-* bin/criteria-runtime.tar bin/SHA256SUMS artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: criteria-${{ steps.rc.outputs.tag }}
          path: artifact/
          retention-days: 30
          if-no-files-found: error

  coverage-check:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    # WS44: per-package non-regression gate. Runs after unit-tests so a test
    # failure surfaces before a coverage failure. Floors live in
    # tools/coverage-floors.txt; a PR that drops below floor must add tests or
    # lower the floor with a documented reason.
    needs: [unit-tests, changes]
    # The coverage ratchet consumes unit-test artifacts (state surface), so it
    # never runs for docs-only PRs: with unit-tests skipped the job's own
    # docs_only condition keeps it skipped too. The changes leg makes the
    # outcome explicit in the graph instead of relying on implicit upstream
    # success().
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-cover-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-cover-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      - name: Enforce coverage floor
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            echo "Checking coverage floors for affected packages against $base..."
            make coverage-check-affected BASE="$base"
          else
            echo "Enforcing full coverage floors across all packages (trunk/push)..."
            make coverage-check
          fi

  coverage-floor-ratchet-guard:
    name: Coverage floor ratchet guard
    runs-on: ubuntu-latest
    # Prevents an autonomous workflow from editing coverage
    # floors downward, removing an existing floor line, or merging its own PR.
    # A floor decrease or removal is allowed only when the PR carries the
    # explicit human-approval label.
    needs: [changes]
    # PR-only guard (non-PR events have no base floor file to diff); it reads
    # coverage floors, a repo-state file, so docs-only PRs skip it too.
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-floor-guard-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-floor-guard-${{ runner.os }}-

      - name: Extract base and head floor files
        run: |
          git show ${{ github.event.pull_request.base.sha }}:tools/coverage-floors.txt > /tmp/coverage-floors.base.txt
          cp tools/coverage-floors.txt /tmp/coverage-floors.head.txt

      - name: Check floor ratchet
        run: |
          approved=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'floor-change-approved') }}" = "true" ]; then
            approved="--approved"
          fi
          go run ./tools/coverage-floor-guard --base /tmp/coverage-floors.base.txt --head /tmp/coverage-floors.head.txt $approved

  # Aggregates the whole CI set. Plain `needs` + a success-only job would be
  # skipped whenever any docs-only-gated job above is skipped, so the result
  # is recomputed explicitly: skipped jobs (docs-only PRs) count as green,
  # failures and cancellations still fail the gate. The changes job itself
  # must succeed — a failed classification skips the repo-state jobs as
  # dependents, so accepting "skipped" for changes would turn a broken
  # classifier into a green aggregate. Branch protection treats skipped
  # required checks as neutral, but this aggregate also gives required checks
  # an explicit green target on docs-only PRs.
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-tests, e2e, install-script-syntax, proto-drift, workspace-sync-drift, osv-scan, govulncheck, coverage-check, coverage-floor-ratchet-guard]
    if: ${{ !cancelled() }}
    steps:
      # Each line is a real template expression; hyphenated job names need
      # bracket access in the Actions expression grammar.
      - name: Recompute aggregate result
        env:
          RESULTS: |
            lint=${{ needs['lint'].result }}
            unit-tests=${{ needs['unit-tests'].result }}
            e2e=${{ needs['e2e'].result }}
            install-script-syntax=${{ needs['install-script-syntax'].result }}
            proto-drift=${{ needs['proto-drift'].result }}
            workspace-sync-drift=${{ needs['workspace-sync-drift'].result }}
            osv-scan=${{ needs['osv-scan'].result }}
            govulncheck=${{ needs['govulncheck'].result }}
            coverage-check=${{ needs['coverage-check'].result }}
            coverage-floor-ratchet-guard=${{ needs['coverage-floor-ratchet-guard'].result }}
          CHANGES_RESULT: ${{ needs['changes'].result }}
        run: |
          set -eu
          status=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *=success|*=skipped) ;;
              *)
                echo "::error::job ${line%%=*} finished with ${line#*=}"
                status=1
                ;;
            esac
          done <<EOF
          $RESULTS
          EOF
          # The docs-only classification must succeed, not merely skip.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job finished with ${CHANGES_RESULT}: docs-only classification must succeed to skip repo-state jobs"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "All required checks passed (docs-only repo-state skips accepted)."
