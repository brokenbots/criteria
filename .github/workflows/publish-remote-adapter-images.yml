name: Publish Remote Adapter Images

# Build and push multi-platform peer-mode container images (ADR-0007) for the
# shell and copilot adapters. The image entrypoint is `criteria peer`: the
# engine-side peer supervisor launches the adapter child and serves the full
# v2 AdapterService contract plus PeerService supervision on the phone-home
# connection. images/remote-adapters/Dockerfile.peer is the only remote
# adapter Dockerfile in this repo since the legacy runner byte-bridge path was
# removed (the claude-agent adapter is TypeScript and packages its own
# container in the claude-agent repo).
#
# The workflow can be triggered by a tag of the form remote-adapters/v* or
# manually, in which case the adapter versions come from workflow inputs.
# CRITERIA_VERSION stamps the criteria engine binary inside the image; the
# Dockerfile fails closed when it is empty because the peer handshake
# advertises criteria_version.

on:
  push:
    tags:
      - 'remote-adapters/v*'
  workflow_dispatch:
    inputs:
      shell_version:
        description: 'Shell adapter version (semver without leading v)'
        required: true
        default: '0.5.2'
      copilot_version:
        description: 'Copilot adapter version (semver without leading v)'
        required: true
        default: '0.5.4'
      copilot_cli_version:
        description: '@github/copilot npm version for copilot image'
        required: true
        default: '1.0.82'
      criteria_version:
        description: 'Criteria version stamped into the engine binary (e.g. v0.5.30). Empty: git describe of the checked-out commit.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: shell
            version: ${{ github.event.inputs.shell_version || '0.5.2' }}
          - adapter: copilot
            version: ${{ github.event.inputs.copilot_version || '0.5.4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Full history: the criteria_version fallback is `git describe` of
        # the checked-out commit, which needs the v* tags in reach.
        with:
          fetch-depth: 0

      - name: Resolve criteria version
        id: criteria_version
        run: |
          set -euo pipefail
          input='${{ github.event.inputs.criteria_version }}'
          if [ -n "$input" ]; then
            version="$input"
          else
            version="$(git describe --tags --match 'v*' --dirty --always HEAD)"
          fi
          if [ -z "$version" ]; then
            echo "::error::CRITERIA_VERSION resolved empty (no input and no v* tags in history); refusing to build a peer image with an unstamped engine."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/remote-adapters/Dockerfile.peer
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ADAPTER_NAME=${{ matrix.adapter }}
            ADAPTER_VERSION=${{ matrix.version }}
            COPILOT_VERSION=${{ github.event.inputs.copilot_cli_version || '1.0.82' }}
            CRITERIA_VERSION=${{ steps.criteria_version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/criteria-adapter-${{ matrix.adapter }}-peer:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/criteria-adapter-${{ matrix.adapter }}-peer:latest
