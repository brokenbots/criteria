name: Publish Remote Adapter Images

# Build and push multi-platform container images for the shell and copilot
# adapters packaged with the generic remote runner (ServeRemote).
#
# The workflow can be triggered by a tag of the form remote-adapters/v* or
# manually, in which case the adapter versions are taken from workflow inputs.

on:
  push:
    tags:
      - 'remote-adapters/v*'
  workflow_dispatch:
    inputs:
      shell_version:
        description: 'Shell adapter version (semver without leading v)'
        required: true
        default: '0.5.2'
      copilot_version:
        description: 'Copilot adapter version (semver without leading v)'
        required: true
        default: '0.5.4'
      copilot_cli_version:
        description: '@github/copilot npm version for copilot image'
        required: true
        default: '1.0.82'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: shell
            version: ${{ github.event.inputs.shell_version || '0.5.2' }}
            base_image: alpine:3.20
          - adapter: copilot
            version: ${{ github.event.inputs.copilot_version || '0.5.4' }}
            base_image: node:20-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v7

      - name: Log in to GHCR
        uses: docker/login-action@v7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/remote-adapters/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ADAPTER_NAME=${{ matrix.adapter }}
            ADAPTER_VERSION=${{ matrix.version }}
            BASE_IMAGE=${{ matrix.base_image }}
            COPILOT_VERSION=${{ github.event.inputs.copilot_cli_version || '1.0.82' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/criteria-adapter-${{ matrix.adapter }}:${{ matrix.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/criteria-adapter-${{ matrix.adapter }}:latest
