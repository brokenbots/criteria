name: Conformance Matrix

on:
  push:
    branches: [adapter-v2, main]
  pull_request:
    branches: [adapter-v2, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        sdk: [go, typescript, python]
        platform: [linux/amd64, linux/arm64, darwin/arm64]
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-latest
          - platform: darwin/arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    name: ${{ matrix.sdk }} / ${{ matrix.platform }}
    steps:
      - name: Checkout criteria
        uses: actions/checkout@v4
        with:
          repository: brokenbots/criteria
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download reference adapter
        id: download
        run: |
          # Placeholder: download criteria-adapter-conformance-target-${{ matrix.sdk }}
          # from the corresponding SDK repo CI artifacts.
          # When WS23/WS24/WS25 publish their reference adapters, replace this
          # with gh run download or curl of the released artifact.
          echo "Reference adapter download not yet wired — see WS26 Step 2"
          exit 1
        continue-on-error: false

      - name: Run conformance suite
        run: |
          go test ./internal/adapter/conformance/... -v -run TestExternalAdapterConformance -count=1
        env:
          CRITERIA_CONFORMANCE_ADAPTER: ${{ steps.download.outputs.adapter_bin }}
          CRITERIA_CONFORMANCE_ADAPTER_NAME: criteria-adapter-conformance-target-${{ matrix.sdk }}

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-${{ matrix.sdk }}-${{ matrix.platform }}
          path: |
            /tmp/conformance-*.json
            /tmp/conformance-*.xml
          if-no-files-found: ignore
