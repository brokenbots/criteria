name: Container E2E

on:
  # Docker-lane gate on every pull request: the container E2E probes the
  # plugin socket handshake through a real in-image adapter child, a defect
  # PR CI cannot otherwise see. Docs-only PRs skip it (a docs diff cannot
  # reach the plugin socket; see .github/scripts/detect-docs-only.sh);
  # workflow_call/schedule events always run full CI.
  pull_request:
  workflow_dispatch:
  # Invoked by remote-e2e.yml so the weekly schedule and the release
  # pipeline's Gate 3 (D57.3) keep covering the container lane.
  workflow_call:

# Read-only GitHub token by default: no job in this workflow writes to the
# repository, API, or packages. A write scope, if ever needed, belongs on
# the single job asking for it.
permissions:
  contents: read

jobs:
  changes:
    name: Detect docs-only PR
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # Full history is only needed to compute the merge-base diff of a
      # pull_request; other events skip checkout and default to full CI.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event $EVENT_NAME: not a pull request, running full CI"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          .github/scripts/detect-docs-only.sh >> "$GITHUB_OUTPUT"

  container-e2e:
    name: Container adapter end-to-end
    runs-on: ubuntu-latest
    needs: [changes]
    # Docs-only PRs skip this repo-state job; mixed diffs run it (see changes).
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-container-e2e-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-container-e2e-${{ runner.os }}-

      - name: Sync workspace
        run: go work sync

      # Container-lane gate (ADR-0014 M8): publishes the fixture adapter as a
      # container-capable artifact into a throwaway loopback registry, locks a
      # container-bound workflow against it, and runs the engine so the adapter
      # child launches in-image and the go-plugin handshake reaches the env
      # host. Needs Docker only; no kind/kubectl.
      - name: Run container adapter smoke tests
        run: go test -v -timeout 10m ./internal/ci/smoke/ -run TestContainerAdapter
        env:
          CRITERIA_CONTAINER_E2E: "1"
