name: Release Gates

# WS38 — two of the four v2 release-gate verifications (README D57.3 + D57.4).
# These must pass on a release-tag candidate before the tag is published; wire
# this workflow as a required status check on tag/release protection so a failed
# gate blocks the release. See docs/release-process.md.
#
#   Gate 3 (D57.3) — Remote transport end-to-end demo (the WS22 smoke).
#   Gate 4 (D57.4) — Publishing flow: build the in-tree noop adapter, publish it
#                    to an ephemeral local OCI registry via `criteria adapter
#                    publish`, then pull it back and verify the round-trip. The
#                    gate is fully self-contained — it depends only on this repo
#                    (per the self-containment principle). The real keyless→GHCR
#                    publish path is validated in each adapter's own repo
#                    publish.yml, not here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read # both gates are self-contained; no registry push or keyless signing

jobs:
  # ── Gate 3 — remote transport end-to-end demo (D57.3) ──────────────────────
  # Reuses the existing Remote E2E workflow (the WS22 smoke) so there is a single
  # source of truth for the remote demo.
  gate-3-remote-e2e:
    name: Gate 3 — remote transport e2e
    uses: ./.github/workflows/remote-e2e.yml

  # ── Gate 4 — publishing flow (D57.4) ───────────────────────────────────────
  # Self-contained publish→pull round-trip: build the in-tree noop adapter,
  # publish it to an ephemeral local OCI registry via `criteria adapter publish`,
  # then pull it back and verify the manifest / Info() round-trip. Depends only
  # on this repo — no external org, no clone repos, no secrets. The real
  # keyless→GHCR publish path is exercised in each adapter repo's own publish.yml.
  gate-4-publish-flow:
    name: Gate 4 — publishing flow
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the criteria CLI and the in-tree noop adapter
        run: |
          set -euo pipefail
          go build -o /usr/local/bin/criteria ./cmd/criteria
          go build -o "${RUNNER_TEMP}/criteria-adapter-noop" ./cmd/criteria-adapter-noop

      - name: Publish noop to the local registry
        run: |
          set -euo pipefail
          # localhost registries default to plain HTTP (oci.IsLocalhost), so no
          # TLS/auth setup is needed. Unsigned is fine here — signing has its own
          # unit coverage (publish/sign_test.go) and the keyless path is proven
          # in the adapter repos.
          criteria adapter publish "${RUNNER_TEMP}/criteria-adapter-noop" \
            --registry localhost:5000/noop:v1.0.0

      - name: Pull it back and verify the round-trip
        env:
          CRITERIA_STATE_DIR: ${{ runner.temp }}/criteria-state
        run: |
          set -euo pipefail
          # Pull verifies the manifest at pull time; --allow-unsigned skips the
          # signature check for this unsigned dev artifact.
          criteria adapter pull --allow-unsigned localhost:5000/noop:v1.0.0

          # `adapter info` reads the cached manifest; `where` resolves the
          # platform binary that was published — a real publish→pull→resolve loop.
          criteria adapter info noop
          binary=$(criteria adapter where noop)
          echo "pulled binary: $binary"
          test -x "$binary"

  # ── Aggregation — single required status check for the release ──────────────
  gates-passed:
    name: Release gates passed
    runs-on: ubuntu-latest
    needs: [gate-3-remote-e2e, gate-4-publish-flow]
    if: ${{ always() }}
    steps:
      - name: Verify required gates
        run: |
          set -euo pipefail
          g3="${{ needs.gate-3-remote-e2e.result }}"
          g4="${{ needs.gate-4-publish-flow.result }}"
          echo "Gate 3 (remote e2e):    $g3"
          echo "Gate 4 (publish flow):  $g4"
          # Both gates are self-contained and must succeed.
          [ "$g3" = "success" ] || { echo "::error::Gate 3 did not pass"; exit 1; }
          [ "$g4" = "success" ] || { echo "::error::Gate 4 did not pass"; exit 1; }
          echo "All required release gates passed."
