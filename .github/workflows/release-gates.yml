name: Release Gates

# WS38 — two of the four v2 release-gate verifications (README D57.3 + D57.4).
# These must pass on a release-tag candidate before the tag is published; wire
# this workflow as a required status check on tag/release protection so a failed
# gate blocks the release. See docs/release-process.md.
#
#   Gate 3 (D57.3) — Remote transport end-to-end demo (the WS22 smoke).
#   Gate 4 (D57.4) — Publishing flow: the three starter-template clones build,
#                    sign, and publish to the CI-owned GHCR org, and the result
#                    is pulled + conformance-checked.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing during the publish-flow gate

jobs:
  # ── Gate 3 — remote transport end-to-end demo (D57.3) ──────────────────────
  # Reuses the existing Remote E2E workflow (the WS22 smoke) so there is a single
  # source of truth for the remote demo.
  gate-3-remote-e2e:
    name: Gate 3 — remote transport e2e
    uses: ./.github/workflows/remote-e2e.yml

  # ── Gate 4 — publishing flow (D57.4) ───────────────────────────────────────
  # Bumps a tag on each CI-owned starter clone, lets the clone's publish workflow
  # run, then pulls the artifact and runs the conformance suite against it.
  #
  # Requires a provisioned CI org. Until then this job is skipped (green) so it
  # never blocks prematurely; enable it by setting the repository variable
  # CRITERIA_CI_ENABLED=true once criteria-ci and its three clones exist. See
  # docs/release-process.md → "Gate 4 setup".
  gate-4-publish-flow:
    name: Gate 4 — publishing flow
    runs-on: ubuntu-latest
    if: ${{ vars.CRITERIA_CI_ENABLED == 'true' }}
    env:
      # The CI-owned GHCR org holding the three starter clones.
      CI_ORG: ${{ vars.CRITERIA_CI_ORG || 'criteria-ci' }}
      # A PAT with `repo` + `workflow` scope on the clone repos (to push tags and
      # read workflow runs) and `read:packages` on the org.
      GH_TOKEN: ${{ secrets.CRITERIA_CI_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [typescript, python, go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build criteria CLI
        run: go build -o /usr/local/bin/criteria ./cmd/criteria

      - name: Bump tag on the starter clone and wait for its publish workflow
        id: publish
        run: |
          set -euo pipefail
          repo="${CI_ORG}/adapter-test-${{ matrix.sdk }}"
          # Derive a unique, sortable test tag from this release run.
          tag="v0.0.0-gate.${GITHUB_RUN_ID}"
          echo "repo=$repo"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

          sha=$(gh api "repos/${repo}/git/refs/heads/main" --jq '.object.sha')
          gh api "repos/${repo}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}"

          # Wait for the clone's publish workflow to complete for this tag.
          for _ in $(seq 1 60); do
            run=$(gh run list --repo "$repo" --workflow publish.yml \
              --branch "$tag" --limit 1 \
              --json status,conclusion,databaseId --jq '.[0]' || echo '')
            status=$(echo "$run" | jq -r '.status // empty')
            if [ "$status" = "completed" ]; then
              concl=$(echo "$run" | jq -r '.conclusion')
              echo "publish workflow concluded: $concl"
              [ "$concl" = "success" ] || { echo "::error::publish failed for $repo@$tag"; exit 1; }
              break
            fi
            sleep 20
          done

      - name: Pull the published artifact and verify it
        run: |
          set -euo pipefail
          ref="ghcr.io/${CI_ORG}/adapter-test-${{ matrix.sdk }}:${{ steps.publish.outputs.version }}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          # Step 3 — pull. This verifies the cosign signature and the manifest at
          # pull time (a failed signature/manifest check fails the gate).
          criteria adapter pull "$ref"

          # `adapter info` launches the pulled binary and checks its runtime
          # Info() response matches the static manifest (README D15) — a real
          # round-trip against the freshly published binary.
          binary=$(criteria adapter where "$ref")
          echo "pulled binary: $binary"
          criteria adapter info "$ref"

      - name: Run the conformance suite
        run: |
          # Step 4 — the WS26 conformance suite. This exercises the v2 protocol
          # contract the published SDK implements. (Targeting the suite directly
          # at the pulled binary via RunAdapter is a tracked deepening; it needs
          # a binary-path runner that lives in non-CI source.)
          make test-conformance

      - name: Clean up the test tag
        if: always()
        run: |
          gh api -X DELETE "repos/${{ steps.publish.outputs.repo }}/git/refs/tags/${{ steps.publish.outputs.tag }}" || true

  # ── Aggregation — single required status check for the release ──────────────
  gates-passed:
    name: Release gates passed
    runs-on: ubuntu-latest
    needs: [gate-3-remote-e2e, gate-4-publish-flow]
    if: ${{ always() }}
    steps:
      - name: Verify required gates
        run: |
          set -euo pipefail
          g3="${{ needs.gate-3-remote-e2e.result }}"
          g4="${{ needs.gate-4-publish-flow.result }}"
          echo "Gate 3 (remote e2e):    $g3"
          echo "Gate 4 (publish flow):  $g4"
          # Gate 3 must succeed. Gate 4 must not fail; 'skipped' is allowed until
          # the CI org is provisioned (CRITERIA_CI_ENABLED).
          [ "$g3" = "success" ] || { echo "::error::Gate 3 did not pass"; exit 1; }
          case "$g4" in
            success|skipped) ;;
            *) echo "::error::Gate 4 did not pass"; exit 1 ;;
          esac
          echo "All required release gates passed."
