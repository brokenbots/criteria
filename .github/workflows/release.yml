name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'           # full releases: v1.2.3 (must be on main)
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'  # rc pre-releases: v1.2.3-rc1 (branch w/ open PR vs main)
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+' # beta pre-releases: v1.2.3-beta1 (branch w/ open PR vs main)

permissions:
  contents: write   # create GitHub Release + upload assets
  id-token: write   # cosign keyless OIDC signing
  pull-requests: read # guard checks for an open PR against main

jobs:
  # ── Release-source policy gate ─────────────────────────────────────────────
  # Full releases (vX.Y.Z) may only come from a commit on `main`. Pre-releases
  # (vX.Y.Z-rc/beta N) may only come from a branch with an open PR against `main`.
  # This keeps `main` the sole source of full releases while letting in-flight
  # branches cut rc/beta builds.
  guard:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Enforce release-source policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          git fetch --quiet origin main
          case "$TAG" in
            *-rc[0-9]*|*-beta[0-9]*)
              mapfile -t branches < <(gh pr list --base main --state open --json headRefName --jq '.[].headRefName')
              if [ "${#branches[@]}" -eq 0 ]; then
                echo "::error::pre-release $TAG requires an open PR against main; none found."
                exit 1
              fi
              ok=0
              for b in "${branches[@]}"; do
                git fetch --quiet origin "$b" || continue
                if git merge-base --is-ancestor "$SHA" "origin/$b"; then ok=1; break; fi
              done
              if [ "$ok" -ne 1 ]; then
                echo "::error::pre-release $TAG ($SHA) is not contained in any branch with an open PR against main."
                exit 1
              fi
              echo "OK: pre-release from a branch with an open PR against main."
              ;;
            *)
              if ! git merge-base --is-ancestor "$SHA" origin/main; then
                echo "::error::full release $TAG ($SHA) must point at a commit on main."
                exit 1
              fi
              echo "OK: full release from main."
              ;;
          esac

  # ── Verification gates (D57) — the release cannot publish unless all pass ────
  # build/docker-image (and therefore sign + publish) depend on every gate, so a
  # failed gate skips the entire release. Heavy gates (remote/publish) run here
  # on the tag rather than on every PR.
  gate-conformance:
    name: Gate 1 — conformance
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Sync workspace
        run: go work sync
      - name: Conformance suite
        run: make test-conformance

  gate-e2e:
    name: Gate 2 — in-tree adapters e2e
    runs-on: ubuntu-latest
    needs: guard
    env:
      CRITERIA_ADAPTERS: ${{ github.workspace }}/bin
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Sync workspace
        run: go work sync
      - name: Build binary and adapter plugins
        run: make build plugins
      - name: CLI smoke test
        run: ./bin/criteria apply examples/hello --events-file /tmp/events.ndjson
      - name: Validate example workflows
        run: make validate
      - name: Example plugin end-to-end
        run: make example-plugin

  gate-remote:
    name: Gate 3 — remote transport e2e
    needs: guard
    uses: ./.github/workflows/remote-e2e.yml

  gate-publish:
    name: Gate 4 — publishing flow
    runs-on: ubuntu-latest
    needs: guard
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the criteria CLI and the in-tree noop adapter
        run: |
          set -euo pipefail
          go build -o /usr/local/bin/criteria ./cmd/criteria
          go build -o "${RUNNER_TEMP}/criteria-adapter-noop" ./internal/adapter/conformance/testdata/noop
      - name: Publish noop to the local registry
        run: |
          set -euo pipefail
          criteria adapter publish "${RUNNER_TEMP}/criteria-adapter-noop" \
            --registry localhost:5000/noop:v1.0.0
      - name: Pull it back and verify the round-trip
        env:
          CRITERIA_STATE_DIR: ${{ runner.temp }}/criteria-state
        run: |
          set -euo pipefail
          criteria adapter pull --allow-unsigned localhost:5000/noop:v1.0.0
          criteria adapter info noop
          binary=$(criteria adapter where noop)
          echo "pulled binary: $binary"
          test -s "$binary"

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [guard, gate-conformance, gate-e2e, gate-remote, gate-publish]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync workspace
        run: go work sync

      - name: Build criteria binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make build

      - name: Build adapter plugins
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make plugins

      - name: Package tarball
        run: |
          TAG="${{ github.ref_name }}"
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"
          TARBALL="criteria-${TAG}-${OS}-${ARCH}.tar.gz"
          mkdir -p dist/${OS}-${ARCH}
          cp bin/criteria bin/criteria-adapter-* LICENSE README.md dist/${OS}-${ARCH}/
          tar -czf "$TARBALL" -C dist/${OS}-${ARCH} .
          echo "tarball=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: criteria-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: criteria-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  docker-image:
    name: Build Docker image tar
    runs-on: ubuntu-latest
    needs: [guard, gate-conformance, gate-e2e, gate-remote, gate-publish]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        run: |
          TAG="${{ github.ref_name }}"
          make docker-runtime
          docker tag criteria/runtime:dev "criteria/runtime:${TAG}"
          docker tag criteria/runtime:dev "criteria/runtime:latest"

      - name: Save image as tar
        run: |
          TAG="${{ github.ref_name }}"
          TARBALL="criteria-runtime-${TAG}.tar"
          docker save -o "$TARBALL" "criteria/runtime:${TAG}"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: criteria-runtime-${{ github.ref_name }}
          path: criteria-runtime-${{ github.ref_name }}.tar
          if-no-files-found: error

  checksum-and-sign:
    name: Checksum and sign
    runs-on: ubuntu-latest
    needs: [build, docker-image]
    # Exposed at job level so the key-based fallback step can gate on presence
    # in its `if:` — the `secrets` context is not available in `if` expressions.
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.tar' \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Compute SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS (keyless via GitHub OIDC)
        working-directory: release-assets
        run: |
          cosign sign-blob \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.cert \
            SHA256SUMS
        continue-on-error: true   # keyless may be unavailable; see release-process.md

      - name: Sign SHA256SUMS (key-based fallback)
        if: ${{ env.RELEASE_SIGNING_KEY != '' && hashFiles('release-assets/SHA256SUMS.sig') == '' }}
        working-directory: release-assets
        run: |
          echo "$RELEASE_SIGNING_KEY" | base64 -d > /tmp/signing.key
          COSIGN_PASSWORD="$RELEASE_SIGNING_PASSWORD" cosign sign-blob \
            --key /tmp/signing.key \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.cert \
            SHA256SUMS
          rm -f /tmp/signing.key

      - name: Require signature
        working-directory: release-assets
        run: |
          if [[ ! -f SHA256SUMS.sig ]]; then
            echo "::error::Neither signing path produced SHA256SUMS.sig."
            echo "::error::Configure OIDC permissions or set RELEASE_SIGNING_KEY / RELEASE_SIGNING_PASSWORD secrets."
            exit 1
          fi

      - name: Upload checksums and signatures
        uses: actions/upload-artifact@v4
        with:
          name: checksums-and-signatures
          path: |
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sig
            release-assets/SHA256SUMS.cert
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [checksum-and-sign]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          # Prefer the ## [TAG] section; for pre-releases (no dedicated section
          # yet) fall back to ## [Unreleased]; finally a bare "Release <tag>".
          python3 - "$TAG" CHANGELOG.md <<'EOF'
          import sys, re
          tag, path = sys.argv[1], sys.argv[2]
          text = open(path).read()
          def section(heading):
              pattern = rf'(^## \[{re.escape(heading)}\].*?)(?=^## |\Z)'
              m = re.search(pattern, text, re.MULTILINE | re.DOTALL)
              return m.group(1).strip() if m else None
          body = section(tag) or section("Unreleased") or f"Release {tag}"
          # Write to a file to avoid shell quoting issues.
          open("release-notes.md", "w").write(body)
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Tags with a hyphen (v1.2.3-rc.1) are pre-releases; mark them so they
          # don't show as "Latest" and downstream tooling can distinguish them.
          PRERELEASE=()
          case "$TAG" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${PRERELEASE[@]}" \
            release-assets/*
