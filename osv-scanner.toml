# osv-scanner configuration (WS49 — vulnerability gate)
#
# Mandate: no shipping code with known security vulnerabilities. The CI `osv-scan`
# job (.github/workflows/ci.yml) and `make vuln-scan` run osv-scanner over every
# Go module in the workspace using this config.
#
# Default posture: NO ignores. A clean tree carries an empty file.
#
# An ignore is an explicit, auditable decision — never a silent skip. Each entry
# MUST carry:
#   - id           the OSV / GHSA / GO advisory id (e.g. "GO-2026-1234")
#   - reason       why it is safe to defer (unreachable code path, false positive,
#                  upstream fix unavailable, etc.)
#   - ignoreUntil  a future review-expiry date (RFC3339). On expiry the finding
#                  re-surfaces and must be re-justified or cleared.
#
# Example (keep commented unless an exception is actually in force):
#
# [[IgnoredVulns]]
# id = "GO-2026-1234"
# reason = "Vulnerable function not reachable from our code paths; tracked in WS51."
# ignoreUntil = "2026-09-01T00:00:00Z"

# GO-2026-5932 (golang.org/x/crypto/openpgp): re-checked 2026-07-28. The
# advisory still has no fixed version and is reported against x/crypto v0.54.0
# (the latest release). We never parse PGP: the package is linked only because
# sigstore-go/pkg/sign imports rekor's pki registry, which registers a pgp
# backend we never select (criteria verifies cosign keyless and key-pair
# signatures via x509/fulcio). govulncheck finds no call into openpgp from our
# code — every trace is package init reached through sign.init, or
# interface-dispatch noise. Dropping the dependency would mean dropping signature
# verification, the trust anchor for `criteria adapter lock` pinning. Re-check
# whether rekor has split its pgp backend out of pkg/pki.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = """golang.org/x/crypto/openpgp is deprecated with no fixed version — the \
advisory covers every release including v0.54.0, so no upgrade clears it. We never \
parse PGP: the package is linked only because sigstore-go/pkg/sign imports rekor's \
pki registry, which registers a pgp backend we never select (criteria verifies \
cosign keyless and key-pair signatures via x509/fulcio). govulncheck finds no call \
into openpgp from our code — every trace is package init reached through sign.init, \
or interface-dispatch noise (io.ReadAll onto armor.lineReader.Read). Dropping the \
dependency would mean dropping signature verification, which is the trust anchor \
for `criteria adapter lock` pinning. Re-check whether rekor has split its pgp \
backend out of pkg/pki."""
ignoreUntil = "2026-10-01T00:00:00Z"
