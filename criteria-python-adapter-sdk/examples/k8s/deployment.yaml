apiVersion: apps/v1
kind: Deployment
metadata:
  name: criteria-adapter-py
  labels:
    app: criteria-adapter-py
spec:
  replicas: 1
  selector:
    matchLabels:
      app: criteria-adapter-py
  template:
    metadata:
      labels:
        app: criteria-adapter-py
    spec:
      containers:
        - name: adapter
          image: criteria-adapter-py:latest
          env:
            - name: CRITERIA_REMOTE_HOST
              value: "criteria.example.com:7778"
            - name: CRITERIA_REMOTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: criteria-adapter-secrets
                  key: token
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/criteria/tls
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: tls-certs
          secret:
            secretName: criteria-adapter-tls
