# golangci-lint configuration for the criteria repo.
# See https://golangci-lint.run/usage/configuration/ for option docs.
version: "2"

run:
  timeout: 5m
  # Lint all three modules in the workspace.
  modules-download-mode: readonly

issues:
  # Day-one baseline lives in .golangci.baseline.yml; W03/W04/W06 burn it down.
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/brokenbots/criteria
  exclusions:
    generated: lax
    paths:
      - ".*\\.pb\\.go$"
      - ".*\\.connect\\.go$"
      - "sdk/pb/.*"
      - "(^|/)bin(/|$)"
      - "(^|/)tools(/|$)"

linters:
  default: none
  enable:
    # Correctness
    - govet              # standard vet checks
    - staticcheck        # SA- and ST-series checks (v2 folds gosimple in)
    - errcheck           # unchecked errors
    - ineffassign        # ineffective assignments
    - unused             # unused symbols
    - bodyclose          # response.Body left open
    - rowserrcheck       # sql.Rows.Err() not checked
    - sqlclosecheck      # sql.Rows / sql.Stmt not closed
    - contextcheck       # context not propagated
    - nilerr             # returns nil after non-nil err check
    - errorlint          # %w / errors.Is/As correctness
    # Hygiene
    - misspell
    - unconvert          # unnecessary type conversions
    - unparam            # unused function parameters / return values
    - prealloc           # slice prealloc opportunities
    - dupword            # accidental "the the" in comments
    # Complexity (hard-fail; suppressions are W03's punch-list)
    - funlen
    - gocyclo
    - gocognit
    # Style / API hygiene (hard-fail; revive carries doc-comment rule)
    - revive
    - gocritic
    - nakedret
    - nolintlint         # nolint directives must be specific + justified
  settings:
    funlen:
      # Tech eval target: no function > 50 lines outside generated code.
      lines: 50
      statements: 40

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    revive:
      rules:
        # GoDoc on exported symbols (drives W06).
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: range-val-in-closure
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # ifElseChain fires too often on outcome-routing switches; keep them readable.
        - ifElseChain
        # whyNoLint is noisy in tandem with nolintlint.
        - whyNoLint
        # go-critic v0.15 drift since the v1 toolchain (v0.12.0): importShadow's
        # detection expanded and now fires on 37 sites v1 accepted; disable it
        # to keep the enforced set v1-equivalent.
        - importShadow

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    errcheck:
      # Common ignored returns; document them so we don't silently grow this list.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    staticcheck:
      # v1 ran the staticcheck linter (SA class) alongside the enabled
      # gosimple linter (S class). v2 folds simple, stylecheck and quickfix
      # analyzers into staticcheck; stylecheck was never enabled here and
      # quickfix did not exist in v1, so limit checks to the SA + S set to
      # keep the enforced class of findings equivalent to the v1 toolchain.
      checks:
        - all
        - -ST*
        - -QF*
        # S1005 asks to drop the blank identifier on drained channel
        # receives, while errcheck (since v1.30) requires that explicit
        # blank assignment for unchecked error-channel receives; keep
        # errcheck's stronger signal and drop the conflicting style nit.
        - -S1005

  exclusions:
    generated: lax
    # v1's exclude-use-default: true carried these four presets implicitly.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - ".*\\.pb\\.go$"
      - ".*\\.connect\\.go$"
      - "sdk/pb/.*"
      - "(^|/)bin(/|$)"
      - "(^|/)tools(/|$)"
    rules:
      # Test files: relax funlen/gocyclo/gocognit and require less GoDoc.
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - revive
          - errcheck
      # main.go for adapter binaries: short bootstrap, no GoDoc requirement.
      - path: cmd/.*/main\.go
        linters:
          - revive
          - funlen
      # unparam drift since the v1 toolchain: this t.Skip'd legacy W13 test
      # closure returns nil by design — the callbackAdapter.fn type mandates
      # the two-result signature (the test is revived by W14, not here).
      - path: internal/engine/iteration_engine_test\.go
        linters:
          - unparam
        text: 'TestIter_WorkflowBody_EarlyExit_StopsLoop\$1 - result 1 \(map\[string\]string\) is always nil'
